<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f4">
  <meta name="description" content="拼豆库存与图纸工作台，数据保存在本机。">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="recognition.css">
  <link rel="stylesheet" href="roi.css">
  <link rel="stylesheet" href="visibility.css">
  <link rel="stylesheet" href="grid.css">
  <title>豆豆工坊</title>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="豆豆工坊首页"><span class="brand-mark">豆</span><span>豆豆工坊</span></a>
    <div style="display:flex;gap:7px"><button class="icon-button" id="importData" title="恢复备份" aria-label="恢复备份">⇩</button><button class="icon-button" id="exportData" title="导出备份" aria-label="导出备份">⇧</button></div>
  </header>
  <main>
    <section class="view active" id="inventoryView">
      <div class="page-heading"><div><p class="eyebrow">MY COLLECTION</p><h1>色号库存</h1></div><button class="text-button" id="adjustAll">调整库存</button></div>
      <div class="summary-strip">
        <div><strong id="colorCount">221</strong><span>个色号</span></div>
        <div><strong id="beadTotal">221,000</strong><span>颗现有库存</span></div>
        <div><strong id="lowCount">0</strong><span>低库存</span></div>
      </div>
      <div class="toolbar"><label class="searchbox"><span>⌕</span><input id="colorSearch" type="search" placeholder="搜索色号" autocomplete="off"></label><select id="inventoryFilter" aria-label="筛选库存"><option value="all">全部色号</option><option value="low">低于 100 颗</option><option value="zero">已用完</option></select></div>
      <div id="inventoryGrid" class="inventory-grid"></div>
    </section>

    <section class="view" id="patternsView">
      <div class="page-heading"><div><p class="eyebrow">PATTERN DESK</p><h1>我的图纸</h1></div><button class="primary-button" id="newPattern">＋ 新建图纸</button></div>
      <div class="import-panel image-import" id="importPanel">
        <div class="import-icon">▧</div><div><h2>从图片识别图纸</h2><p>框选网格和底部色号统计，只识别少量色号，其余按本图色块快速匹配。</p></div>
        <label class="file-picker">选择图纸图片<input id="patternImage" type="file" accept="image/*"></label>
        <div id="imageStage" class="image-stage" hidden><canvas id="imageCanvas"></canvas><div class="crop-help" id="cropHelp">拖动框选网格内侧边界</div></div>
        <div class="roi-selectors" id="roiSelectors" hidden><button id="selectBoard" class="selected">选网格区域</button><button id="selectLegend">选底部统计区域</button></div>
        <div class="recognition-fields" id="recognitionFields" hidden>
          <label>列数<input id="gridCols" type="number" min="1" max="160" value="48"></label>
          <label>行数<input id="gridRows" type="number" min="1" max="160" value="48"></label>
          <label class="pattern-name-field">图纸名称<input id="patternName" type="text" placeholder="例如：小花胸针"></label>
          <button class="primary-button" id="recognizePattern">识别色号</button>
        </div>
        <div id="recognitionStatus" class="recognition-status" hidden></div>
        <div id="recognitionAudit" class="recognition-audit" hidden></div>
        <button class="secondary-button" id="saveRecognized" hidden>确认并保存图纸</button>
        <details class="manual-import"><summary>粘贴色号网格</summary>
          <textarea id="patternInput" rows="4" placeholder="A1 A1 B2 B2 C3&#10;A1 B2 B2 C3 C3"></textarea>
          <button class="primary-button" id="importPattern">生成图纸</button>
        </details>
      </div>
      <div id="patternList" class="pattern-list"></div>
      <div class="editor" id="patternEditor" hidden></div>
    </section>

    <section class="view" id="workView">
      <div class="page-heading"><div><p class="eyebrow">BEAD BY COLOR</p><h1>拼制模式</h1></div></div>
      <div id="workEmpty" class="empty-state"><div class="empty-symbol">◉</div><h2>选择一张图纸开始拼</h2><p>按色号筛选，高亮对应格子，并记录已完成数量。</p><button class="primary-button" data-goto="patterns">查看图纸</button></div>
      <div id="workArea" hidden></div>
    </section>
  </main>
  <nav class="bottom-nav" aria-label="主导航">
    <button class="nav-item active" data-view="inventory"><span>▤</span>库存</button>
    <button class="nav-item" data-view="patterns"><span>▦</span>图纸</button>
    <button class="nav-item" data-view="work"><span>◉</span>拼制</button>
  </nav>
  <dialog id="confirmDialog"><form method="dialog" class="dialog-body"><button class="dialog-close" value="cancel" aria-label="关闭">×</button><h2 id="dialogTitle"></h2><div id="dialogContent"></div><div class="dialog-actions"><button class="secondary-button" value="cancel">取消</button><button class="primary-button" id="dialogConfirm" value="confirm">确定</button></div></form></dialog>
  <input type="file" id="backupInput" accept="application/json" hidden>
  <script src="palette-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
